# Integración continua de glucy-ios.
# Corre en cada pull request y en cada push a main y develop. Nada se fusiona con esto en rojo.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Mientras no exista el proyecto de Xcode el flujo se salta la compilación en lugar de
      # fallar. `compgen -G` se usa en vez de `ls` porque `ls a b` devuelve error si uno solo
      # de los dos patrones no encuentra nada, y eso hacía que la compilación se omitiera
      # incluso con el proyecto ya subido.
      - name: Ver si ya hay proyecto de Xcode
        id: proyecto
        shell: bash
        run: |
          if compgen -G "*.xcodeproj" > /dev/null || compgen -G "*.xcworkspace" > /dev/null; then
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
            echo "Todavía no hay proyecto de Xcode. Se omite la compilación."
          fi

      # El runner trae varias versiones de Xcode y la seleccionada no siempre es la más
      # nueva. Un proyecto guardado con un Xcode posterior no se puede ni abrir, así que se
      # elige la mayor disponible y se deja anotada en la bitácora.
      - name: Usar el Xcode más reciente del runner
        if: steps.proyecto.outputs.existe == 'si'
        shell: bash
        run: |
          echo "Xcode instalados en el runner:"
          ls -d /Applications/Xcode*.app
          elegido="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$elegido/Contents/Developer"
          xcodebuild -version

      # El simulador se elige en el momento y se pasa por identificador, no por nombre: la
      # imagen del runner trae varias versiones de iOS y no todos los modelos existen en
      # todas. Pasar solo el nombre hace que xcodebuild lo busque en «OS:latest» y falle con
      # «unable to find a device matching the provided destination specifier» aunque ese
      # modelo exista en una versión anterior.
      - name: Elegir un simulador disponible
        if: steps.proyecto.outputs.existe == 'si'
        id: simulador
        shell: bash
        run: |
          elegido=$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          equipos = json.load(sys.stdin)['devices']

          def version(runtime):
              m = re.search(r'iOS-([0-9-]+)\$', runtime)
              return tuple(int(x) for x in m.group(1).split('-')) if m else (0,)

          candidatos = [r for r in equipos
                        if 'iOS' in r and any(d['name'].startswith('iPhone') for d in equipos[r])]
          if not candidatos:
              print('')
          else:
              runtime = max(candidatos, key=version)
              iphones = [d for d in equipos[runtime] if d['name'].startswith('iPhone')]
              print(iphones[-1]['udid'] + '|' + iphones[-1]['name'])
          ")
          if [ -z "$elegido" ]; then
            echo "No hay ningún simulador de iPhone en el runner." >&2
            exit 1
          fi
          echo "Usando el simulador: ${elegido#*|} (${elegido%%|*})"
          echo "id=${elegido%%|*}" >> "$GITHUB_OUTPUT"

      # El Xcode de la MacBook de Jesus es más nuevo que cualquiera de los quince que trae
      # el runner y guarda el proyecto con `objectVersion = 110`, que Xcode 26.6 no puede
      # abrir siquiera. Aquí se baja a 77, que es el formato de Xcode 16, el que el propio
      # proyecto declara como preferido (`preferredProjectObjectVersion = 77`) y el primero
      # que soporta las carpetas sincronizadas, así que no se pierde nada.
      #
      # Se modifica SOLO la copia descargada en el runner; el repositorio no cambia. Es un
      # apaño consciente: mientras dure, la compilación no corre sobre un archivo idéntico
      # al del repositorio. Se quita en cuanto GitHub ofrezca un Xcode igual o más nuevo.
      - name: Ajustar el formato del proyecto al Xcode del runner
        if: steps.proyecto.outputs.existe == 'si'
        shell: bash
        run: |
          archivo=Glucy.xcodeproj/project.pbxproj
          actual=$(sed -n 's/^[[:space:]]*objectVersion = \([0-9]*\);.*/\1/p' "$archivo" | head -1)
          echo "Formato del proyecto en el repositorio: $actual"
          if [ -n "$actual" ] && [ "$actual" -gt 77 ]; then
            sed -i '' "s/^\([[:space:]]*\)objectVersion = $actual;/\1objectVersion = 77;/" "$archivo"
            echo "Bajado a 77 solo para esta compilación."
          fi

      # Solo las pruebas de dominio: son las que tienen consecuencia clínica y las que corren
      # en segundos. Las de interfaz entran cuando la fase 1 tenga pantallas.
      - name: Compilar y correr las pruebas de dominio
        if: steps.proyecto.outputs.existe == 'si'
        run: |
          xcodebuild test \
            -scheme Glucy \
            -destination "platform=iOS Simulator,id=${{ steps.simulador.outputs.id }}" \
            -only-testing:GlucyTests \
            CODE_SIGNING_ALLOWED=NO
